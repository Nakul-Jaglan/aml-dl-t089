name: Project integrity checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU PyTorch for Phase 2 checks
        run: python -m pip install 'torch==2.15.0' --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[dev,phase2]'
      - run: python -m pytest -q
      - name: Validate notebook format without retraining
        run: python scripts/check_notebook.py
